      2018-2025 and 69 individuals, a different period and a different instrument from the
      Argos study at the same site - the two are registered separately and must not be
      concatenated into one series without a break term. Arctic foxes range onto sea ice, so
      a strictly terrestrial reading of these tracks is wrong.
    added: 2026-08-01

  - id: movebank_bylot_fox_argos
    title: Arctic fox Bylot - Argos tracking
    evidence_type: track
    realm: terrestrial
    taxon_scope: exact
    landing_page: https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study942774711
    doi: 10.5441/001/1.3gg33bd4
    licence: CC0 1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    citation: >-
      Berteaux D. 2021. Data from: Study "Arctic fox Bylot - Argos tracking". Movebank Data
      Repository. https://doi.org/10.5441/001/1.3gg33bd4
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: CC0 waives rights; the citation is an academic obligation regardless.
    default_sensitivity: low
    taxon_sensitivity:
      - taxon_key: 5219303
        sensitivity: low
        rationale: >-
          Same population and the same reasoning as the GPS-UHF study at Bylot: trapped
          elsewhere, not here, not localised, not targeted.
    credential: movebank_user
    caveats: >-
      Argos Doppler positions, so location error is hundreds of metres to kilometres rather
      than the metres a GPS fix gives - 64,489 locations over 2007-2021 from 170 individuals
      is a sparse, coarse record. Its error is far below the 0.25-degree publication grid but
      not below a daily displacement, so a movement metric must account for it.
    added: 2026-08-01

  - id: movebank_svalbard_reindeer
    title: Svalbard Reindeer Project - Nordenskiold Land
    evidence_type: track
    realm: terrestrial
    taxon_scope: exact
    landing_page: https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study2608802883
    licence: CC BY-NC 4.0
    licence_url: https://creativecommons.org/licenses/by-nc/4.0/
    citation: >-
      Loe LE, Hansen BB, Stien A, Albon SD, Bischof R, Carlsson A, Irvine RJ, Meland M,
      Rivrud IM, Ropstad E, Veiberg V, Mysterud A. 2016. Behavioral buffering of extreme
      weather events in a high-Arctic herbivore. Ecosphere 7(6):e01374.
      https://doi.org/10.1002/ecs2.1374
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: false
      notes: >-
        CC BY-NC. The only non-commercial source in the lake, so anything derived from it
        carries that restriction onward and it cannot be pooled into a product offered on
        commercial terms.
    default_sensitivity: moderate
    taxon_sensitivity:
      - taxon_key: 5220114
        sensitivity: moderate
        rationale: >-
          The same species as the BC caribou and deliberately not the same classification.
          Svalbard's population is roughly 20,000, protected, and hunted under quota on
          Nordenskiold Land; there is no persecution pressure and no tiny herd to locate.
          Sensitivity is a property of the population, not of the binomial.
    credential: movebank_user
    caveats: >-
      Svalbard reindeer are a sedentary high-Arctic subspecies that does not undertake long
      migrations, so a migration-timing metric applied here measures small seasonal range
      shifts and not migration. Carries Accessory Measurements alongside GPS.
    added: 2026-08-01

  - id: movebank_hebblewhite_wolves
    title: Hebblewhite Alberta-BC Wolves
    evidence_type: track
    realm: terrestrial
    taxon_scope: exact
    landing_page: https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study209824313
    doi: 10.5441/001/1.662
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Hebblewhite M. 2025. Data from: Study "Hebblewhite Alberta-BC Wolves". Movebank Data
      Repository. https://doi.org/10.5441/001/1.662
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        CC BY permits redistribution with attribution, and this field records the licence and
        nothing else. The gate refuses this source on `high` sensitivity instead, which is a
        separate reason and produces the message an operator needs to read.
    default_sensitivity: high
    taxon_sensitivity:
      - taxon_key: 5219173
        sensitivity: high
        rationale: >-
          The one demonstrated pathway in the literature. An anti-wolf site published
          instructions for locating collared wolves by telemetry; Idaho subsequently made
          telemetry-aided hunting specifically illegal; four of the eleven collared wolves on
          Yellowstone's Northern Range were shot in a single season. Alberta runs wolf culls.
          Cooke et al. 2017, Conservation Biology, cobi.12895.
    credential: movebank_user
    caveats: >-
      Twelve years and 68 individuals, below the fifteen-year floor this project applies to
      change detection, so this source is here to exercise the gate and to fill the
      terrestrial carnivore gap rather than to carry a trend. Note that the Canis lupus key
      also covers domestic dogs, and most Movebank studies carrying it are dogs rather than
      wolves - the key does not identify the risk, the population does.
    added: 2026-08-01
