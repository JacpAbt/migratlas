# The source registry. Nothing may be ingested that is not described here.
#
# Every entry needs a licence recorded verbatim, a citation, and a sensitivity
# classification. Individual-granularity sources additionally need per-taxon
# classifications -- a source-wide default cannot speak for the most sensitive species
# in the set. See docs/ETHICS.md.

sources:
  - id: darkecology_daily
    title: Dark Ecology Dataset — daily time series of aerial biomass, 1995–2025
    evidence_type: flux
    realm: aerial
    # Not "birds". The radar cannot separate birds from bats from insects, and saying
    # otherwise would be attributing a signal we have not attributed.
    taxon_scope: unattributed
    landing_page: https://darkecology.github.io/dataset/
    # Version DOI, not the concept DOI (10.5281/zenodo.13345265). The concept DOI floats
    # to whatever is newest, which would make a published figure unreproducible.
    doi: 10.5281/zenodo.18433334
    download_uri: https://zenodo.org/records/18433334
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Dark Ecology project (2026). Dark Ecology Dataset: Measurements of Biological
      Activity in US Weather Radar — Time Series Data from 1995–2025, v1.1.0. Zenodo.
      https://doi.org/10.5281/zenodo.18433334
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: CC BY permits redistribution of derived products with attribution.
    # Aggregate passage past fixed public infrastructure, no taxon and no individual.
    # There is nothing here for anyone to hunt.
    default_sensitivity: not_sensitive
    caveats: >-
      Measures aerial biomass, not birds: MistNet separates precipitation from biology,
      not birds from bats from insects. `traffic` is vertically and temporally
      integrated, so it carries no height information — use the profiles product for
      flight altitude. Station histories are uneven across 1995–2025 and the NEXRAD
      dual-polarisation upgrade around 2011–2013 is a step change in the instrument that
      must be modelled as a break rather than read as a biological trend; the daily
      product does not label hardware generation, so upgrade dates have to come from
      elsewhere. Nights with a high `fraction_missing` must be excluded before computing
      passage quantiles.
    added: 2026-07-28

  - id: darkecology_profiles
    title: Dark Ecology Dataset — vertical profiles of aerial biomass, 1995–2025
    evidence_type: flux
    realm: aerial
    taxon_scope: unattributed
    landing_page: https://darkecology.github.io/dataset/
    # Concept DOI of the 1995–1999 block; the product spans seven records of five-year
    # blocks, each with its own version DOI, pinned at ingest time.
    doi: 10.5281/zenodo.13345173
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Dark Ecology project (2026). Dark Ecology Dataset: Measurements of Biological
      Activity in US Weather Radar — Vertical Profiles, v1.1.0. Zenodo.
      https://doi.org/10.5281/zenodo.13345173
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: CC BY permits redistribution of derived products with attribution.
    default_sensitivity: not_sensitive
    caveats: >-
      Not yet ingested. Roughly 220 GiB across seven Zenodo records in five-year blocks,
      one CSV per radar volume scan under profiles/YYYY/MM/DD/STATION/. Height-resolved,
      so it is the source for flight-altitude questions — but for seasonal passage timing
      the daily product answers the same question from 159 MiB, so this stays unfetched
      until altitude is actually the question.
    added: 2026-07-28

  - id: megamove
    title: MegaMove — global space use of marine megafauna
    evidence_type: abundance_surface
    realm: marine
    taxon_scope: exact
    landing_page: https://datadryad.org/dataset/doi:10.5061/dryad.x95x69ptv
    doi: 10.5061/dryad.x95x69ptv
    licence: CC0 1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    citation: >-
      Sequeira, A. M. M. et al. (2025) Global tracking of marine megafauna space use
      reveals how to achieve conservation targets. Science.
      Data: https://doi.org/10.5061/dryad.x95x69ptv
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        CC0 waives rights, but citation is an academic obligation regardless and the
        authors asked for it. One component (anthropogenic threats) is hosted
        separately under different terms and is not ingested.
    # Published as 1-degree grid counts, so the aggregation the ethics gate would
    # otherwise impose has already been applied upstream by the authors.
    default_sensitivity: low
    caveats: >-
      Derived products only — 1-degree gridded space use, not raw tracks. Grid cell
      counts of tracked individuals reflect research effort as much as animal
      distribution; the published bias-testing datasets must be used alongside them.
      Covers 1985–2018, so it does not speak to the last several years.
    added: 2026-07-28

  - id: obis_speciesgrids
    title: OBIS speciesgrids — gridded marine species distributions (H3 level 7)
    evidence_type: abundance_surface
    realm: marine
    taxon_scope: exact
    landing_page: https://github.com/iobis/speciesgrids
    download_uri: https://obis-products.s3.amazonaws.com/speciesgrids/h3_7/
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      OBIS (2026). speciesgrids: WoRMS-aligned gridded marine species distributions derived
      from OBIS and GBIF occurrence snapshots. Ocean Biodiversity Information System.
      https://github.com/iobis/speciesgrids
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        Derived from OBIS and GBIF occurrence snapshots, whose contributing datasets carry
        their own terms; cite OBIS and GBIF as well as this product.
    # Occurrence records aggregated to ~5 km hexagons over decades. Coarse, historical and
    # already summarised over individuals.
    default_sensitivity: low
    caveats: >-
      Occurrence records per H3 cell, not individuals and not abundance — this measures
      sampling effort as much as distribution, and must never be summed against a
      relative-abundance or tracked-individual surface. Not a movement product: there is no
      within-year timing, only a min/max year per cell. Ingest is deliberately bounded to
      vertebrate and cephalopod classes; the full product is 257k species and 43M cells
      dominated by gastropods, crustaceans and diatoms, and Teleostei is excluded for now
      because it adds 27k species each needing a Backbone lookup. Upstream keys species by
      WoRMS AphiaID, so names are resolved through the GBIF Backbone and any species that
      fails to resolve is dropped and logged rather than published without a key.
      Finally, "marine" here is generous: because OBIS aggregates coastal and estuarine
      records from GBIF, the vertebrate slice includes plainly non-marine birds — mallard,
      killdeer and great blue heron are among the widest-ranging species by cell count.
      Any genuinely marine analysis needs a further filter on top of this ingest.
    added: 2026-07-28
