# The source registry. Nothing may be ingested that is not described here.
#
# Every entry needs a licence recorded verbatim, a citation, and a sensitivity
# classification. Individual-granularity sources additionally need per-taxon
# classifications -- a source-wide default cannot speak for the most sensitive species
# in the set. See docs/ETHICS.md.

sources:
  - id: darkecology_daily
    title: Dark Ecology Dataset — daily time series of aerial biomass, 1995–2025
    evidence_type: flux
    realm: aerial
    # Not "birds". The radar cannot separate birds from bats from insects, and saying
    # otherwise would be attributing a signal we have not attributed.
    taxon_scope: unattributed
    landing_page: https://darkecology.github.io/dataset/
    # Version DOI, not the concept DOI (10.5281/zenodo.13345265). The concept DOI floats
    # to whatever is newest, which would make a published figure unreproducible.
    doi: 10.5281/zenodo.18433334
    download_uri: https://zenodo.org/records/18433334
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Dark Ecology project (2026). Dark Ecology Dataset: Measurements of Biological
      Activity in US Weather Radar — Time Series Data from 1995–2025, v1.1.0. Zenodo.
      https://doi.org/10.5281/zenodo.18433334
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: CC BY permits redistribution of derived products with attribution.
    # Aggregate passage past fixed public infrastructure, no taxon and no individual.
    # There is nothing here for anyone to hunt.
    default_sensitivity: not_sensitive
    caveats: >-
      Measures aerial biomass, not birds: MistNet separates precipitation from biology,
      not birds from bats from insects. `traffic` is vertically and temporally
      integrated, so it carries no height information — use the profiles product for
      flight altitude. Station histories are uneven across 1995–2025 and the NEXRAD
      dual-polarisation upgrade around 2011–2013 is a step change in the instrument that
      must be modelled as a break rather than read as a biological trend; the daily
      product does not label hardware generation, so upgrade dates have to come from
      elsewhere. Nights with a high `fraction_missing` must be excluded before computing
      passage quantiles.
    added: 2026-07-28

  - id: darkecology_profiles
    title: Dark Ecology Dataset — vertical profiles of aerial biomass, 1995–2025
    evidence_type: flux
    realm: aerial
    taxon_scope: unattributed
    landing_page: https://darkecology.github.io/dataset/
    # Concept DOI of the 1995–1999 block; the product spans seven records of five-year
    # blocks, each with its own version DOI, pinned at ingest time.
    doi: 10.5281/zenodo.13345173
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Dark Ecology project (2026). Dark Ecology Dataset: Measurements of Biological
      Activity in US Weather Radar — Vertical Profiles, v1.1.0. Zenodo.
      https://doi.org/10.5281/zenodo.13345173
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: CC BY permits redistribution of derived products with attribution.
    default_sensitivity: not_sensitive
    caveats: >-
      Not yet ingested. Roughly 220 GiB across seven Zenodo records in five-year blocks,
      one CSV per radar volume scan under profiles/YYYY/MM/DD/STATION/. Height-resolved,
      so it is the source for flight-altitude questions — but for seasonal passage timing
      the daily product answers the same question from 159 MiB, so this stays unfetched
      until altitude is actually the question.
    added: 2026-07-28

  - id: megamove
    title: MegaMove — global space use of marine megafauna
    evidence_type: abundance_surface
    realm: marine
    taxon_scope: exact
    landing_page: https://datadryad.org/dataset/doi:10.5061/dryad.x95x69ptv
    doi: 10.5061/dryad.x95x69ptv
    licence: CC0 1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    citation: >-
      Sequeira, A. M. M. et al. (2025) Global tracking of marine megafauna space use
      reveals how to achieve conservation targets. Science.
      Data: https://doi.org/10.5061/dryad.x95x69ptv
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        CC0 waives rights, but citation is an academic obligation regardless and the
        authors asked for it. One component (anthropogenic threats) is hosted
        separately under different terms and is not ingested.
    # Published as 1-degree grid counts, so the aggregation the ethics gate would
    # otherwise impose has already been applied upstream by the authors.
    default_sensitivity: low
    caveats: >-
      Derived products only — 1-degree gridded space use, not raw tracks. Grid cell
      counts of tracked individuals reflect research effort as much as animal
      distribution; the published bias-testing datasets must be used alongside them.
      Covers 1985–2018, so it does not speak to the last several years.
    added: 2026-07-28

  - id: obis_speciesgrids
    title: OBIS speciesgrids — gridded marine species distributions (H3 level 7)
    evidence_type: abundance_surface
    realm: marine
    taxon_scope: exact
    landing_page: https://github.com/iobis/speciesgrids
    download_uri: https://obis-products.s3.amazonaws.com/speciesgrids/h3_7/
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      OBIS (2026). speciesgrids: WoRMS-aligned gridded marine species distributions derived
      from OBIS and GBIF occurrence snapshots. Ocean Biodiversity Information System.
      https://github.com/iobis/speciesgrids
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        Derived from OBIS and GBIF occurrence snapshots, whose contributing datasets carry
        their own terms; cite OBIS and GBIF as well as this product.
    # Occurrence records aggregated to ~5 km hexagons over decades. Coarse, historical and
    # already summarised over individuals.
    default_sensitivity: low
    caveats: >-
      Occurrence records per H3 cell, not individuals and not abundance — this measures
      sampling effort as much as distribution, and must never be summed against a
      relative-abundance or tracked-individual surface. Not a movement product: there is no
      within-year timing, only a min/max year per cell. Ingest is deliberately bounded to
      vertebrate and cephalopod classes; the full product is 257k species and 43M cells
      dominated by gastropods, crustaceans and diatoms, and Teleostei is excluded for now
      because it adds 27k species each needing a Backbone lookup. Upstream keys species by
      WoRMS AphiaID, so names are resolved through the GBIF Backbone and any species that
      fails to resolve is dropped and logged rather than published without a key.
      Finally, "marine" here is generous: because OBIS aggregates coastal and estuarine
      records from GBIF, the vertebrate slice includes plainly non-marine birds — mallard,
      killdeer and great blue heron are among the widest-ranging species by cell count.
      Any genuinely marine analysis needs a further filter on top of this ingest.
    added: 2026-07-28

  - id: ebird_status_trends
    title: eBird Status and Trends — weekly relative abundance (2023 release)
    evidence_type: abundance_surface
    realm: aerial
    taxon_scope: exact
    landing_page: https://science.ebird.org/en/status-and-trends
    download_uri: https://st-download.ebird.org/v1/
    licence: eBird Status and Trends Products Terms of Use
    licence_url: https://ebird.org/about/products-access-terms-of-use
    citation: >-
      Fink, D., T. Auer, A. Johnston, M. Strimas-Mackey, S. Ligocki, O. Robinson, W. Hochachka,
      L. Jaromczyk, C. Crowley, K. Dunham, A. Stillman, I. Davies, A. Rodewald, V. Ruiz-Gutierrez,
      C. Wood (2023). eBird Status and Trends, Data Version: 2023. Cornell Lab of Ornithology,
      Ithaca, New York.
    redistribution:
      # THE REASON THIS SOURCE EXISTS IN THE REGISTRY AS UNPUBLISHABLE.
      # The Terms permit use and permit reporting results; they forbid serving the products or
      # anything derived from them. Verbatim: "You shall not... redistribute eBird Status and
      # Trends Data Products... through websites... or via any other means or technology without
      # the prior written permission of the Cornell Lab." The gate refuses a clearance for this
      # source, so no exporter can publish it even by mistake.
      allowed: false
      attribution_required: true
      commercial_use: false
      notes: >-
        Analysis and reported statistics only. Non-peer-reviewed use is capped at 50 species,
        which is why the species list is a fixed, curated constant rather than a query. Any
        published visualisation would additionally have to be shown exactly as downloaded,
        with the Cornell logo and citation embedded — a further reason nothing from here
        reaches the globe.
    # Modelled relative abundance of birds. Nothing here locates an individual animal, and the
    # products are already smoothed to 3 km at their finest.
    default_sensitivity: not_sensitive
    caveats: >-
      A single modelled year at weekly resolution, not an annual time series — the 2023 release
      describes one representative year, so it can validate the SHAPE of a seasonal cycle but
      cannot corroborate a trend across years, and cannot speak to the 2012 instrument step.
      Relative abundance is standing stock, not passage flux: a station-level comparison against
      radar traffic must compare timing landmarks or rates of change, never levels. Release
      versions are not comparable to each other; the models change between them.
    added: 2026-07-29

  - id: fishglob
    title: FISHGLOB — 29 harmonised scientific bottom-trawl surveys
    evidence_type: survey_index
    realm: marine
    taxon_scope: exact
    landing_page: https://github.com/AquaAuma/FishGlob_data
    download_uri: https://raw.githubusercontent.com/AquaAuma/FishGlob_data/main/outputs/Cleaned_data/
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Maureaud, A. A., Palacios-Abrantes, J., Kitchel, Z., Mannocci, L., Pinsky, M. L.,
      Fredston, A., Beukhof, E., Forrest, D. L., Frelat, R., Palomares, M. L. D., Pecuchet, L.,
      Thorson, J. T., van Denderen, P. D., Merigot, B. (2024). FISHGLOB_data: an integrated
      dataset of fish biodiversity sampled with scientific bottom-trawl surveys.
      Scientific Data 11, 24. https://doi.org/10.1038/s41597-023-02866-w
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        CC BY 4.0 on the compilation. The contributing national surveys carry their own terms and
        their own citations; the data descriptor's Table 1 lists them and must be credited
        alongside FISHGLOB for any survey whose data is shown.
    # Fisheries-independent survey catches of fish, aggregated per haul. Station positions are
    # published by the survey programmes themselves and there is no individual animal to locate.
    default_sensitivity: not_sensitive
    caveats: >-
      Continental-shelf trawlable ground only — North Atlantic, North Pacific and a few other
      shelves. No open ocean, no pelagic megafauna, almost nothing in the southern hemisphere, and
      nothing where a trawl cannot go. Survey footprints change across decades as stations are added
      and dropped, so any distribution metric must be restricted to consistently sampled cells or
      it measures where the ship went. Gear changes within several series and is a step change in
      the instrument, like the NEXRAD dual-polarisation upgrade. Catch in numbers is the standard
      basis for distribution centroids, but a trawl selects by size and behaviour and is not a
      census.
    added: 2026-07-29

  # The first source here that provides only drivers -- no evidence about any animal, so no
  # evidence_type and no taxon_scope. Registered all the same, because the registry is where a
  # licence is recorded and PROVENANCE.md is generated from it; a driver left out would be a
  # source whose terms nothing states.
  - id: narr
    title: NCEP North American Regional Reanalysis — pressure-level winds, 1979–present
    realm: aerial
    landing_page: https://psl.noaa.gov/data/gridded/data.narr.html
    download_uri: https://psl.noaa.gov/thredds/dodsC/Datasets/NARR/pressure/
    # A work of the US federal government, so not subject to domestic copyright
    # (17 U.S.C. §105). NOAA asks to be credited and asks that its data not be presented in a
    # way implying endorsement, neither of which is a restriction on redistribution.
    licence: US Government work, public domain (17 U.S.C. §105)
    licence_url: https://www.noaa.gov/information-technology/open-data-dissemination
    citation: >-
      Mesinger, F., DiMego, G., Kalnay, E., Mitchell, K., Shafran, P. C., Ebisuzaki, W.,
      Jović, D., Woollen, J., Rogers, E., Berbery, E. H., Ek, M. B., Fan, Y., Grumbine, R.,
      Higgins, W., Li, H., Lin, Y., Manikin, G., Parrish, D., Shi, W. (2006). North American
      Regional Reanalysis. Bulletin of the American Meteorological Society 87, 343–360.
      https://doi.org/10.1175/BAMS-87-3-343
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        Public domain, so redistribution of derived products is unrestricted. Credit NOAA PSL as
        the distributor and cite Mesinger et al. 2006 as the reanalysis.
    # A wind field. There is no animal in it, so nothing to protect.
    default_sensitivity: not_sensitive
    caveats: >-
      North America only — the Lambert Conformal domain stops at the continent, so this cannot
      serve a European or southern-hemisphere network and ERA5 via the Copernicus CDS is the
      substitute there (docs/adr/0006). A reanalysis is a model constrained by observations, not a
      measurement: its assimilated observing system changed across 1979–present, so a trend in a
      NARR variable is not automatically a trend in the atmosphere, and any trend computed from a
      quantity derived against it must be reported alongside the trend in the NARR term itself.
      32 km cells mean a station near a coast or a mountain front is represented worse than an
      inland one; the ingest records each station's distance to its cell centre for that reason.
      Night winds here are means over the 00/03/06/09 UTC steps, which approximate but do not
      reproduce any individual station's true night boundaries.
    added: 2026-07-29

  # The second driver-only source, and the one that reaches outside North America. Its first job
  # here is as an *independent* precipitation record: whether the radar dataset's 2012 screening
  # step is weather or instrument (docs/methods/phase1c-homogeneity.md, Test D).
  - id: era5
    title: ERA5 monthly averaged reanalysis on single levels, 1940–present
    realm: aerial
    landing_page: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels-monthly-means
    download_uri: https://cds.climate.copernicus.eu/api/retrieve/v1/processes/reanalysis-era5-single-levels-monthly-means
    # Read off the collection metadata rather than assumed: the STAC record gives license
    # "CC-BY-4.0" and the licence the account must accept has id `cc-by`. Accepting the older
    # `licence-to-use-copernicus-products` does NOT satisfy it -- ERA5 was migrated.
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Hersbach, H., Bell, B., Berrisford, P., Biavati, G., Horányi, A., Muñoz Sabater, J.,
      Nicolas, J., Peubey, C., Radu, R., Rozum, I., Schepers, D., Simmons, A., Soci, C., Dee, D.,
      Thépaut, J-N. (2023). ERA5 monthly averaged data on single levels from 1940 to present.
      Copernicus Climate Change Service (C3S) Climate Data Store (CDS).
      https://doi.org/10.24381/cds.f17050d7
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        CC BY 4.0 permits redistribution of derived products with attribution. Copernicus asks
        that products be credited to the Copernicus Climate Change Service and that neither the
        European Commission nor ECMWF be represented as endorsing the result.
    credential: cds_token
    # A precipitation field. There is no animal in it.
    default_sensitivity: not_sensitive
    caveats: >-
      A reanalysis is a model constrained by observations, not a measurement, and ERA5's
      assimilated observing system changed across 1940–present — so a trend in an ERA5 variable is
      not automatically a trend in the atmosphere. That matters less for the discontinuity it is
      first used to test, which is a step at one specific year unrelated to ERA5's own history,
      than it would for a claim about the whole record. Monthly means smooth away the daily extremes
      that drive rainfall screening, so this bounds whether the climate moved rather than measuring
      what any individual night looked like. 0.25° cells over a 32 km radar footprint means a
      station near a sharp precipitation gradient is represented worse than one inland.
      Access needs a personal access token AND a one-off acceptance of the `cc-by` licence.
    added: 2026-07-29

  # The third driver-only source, and the only one that is not an observation at all: DAMIP runs
  # the same models with and without human forcing, so `hist-nat` is a climate that never happened.
  # Landed with kind=simulated for exactly that reason -- see drivers/schema.py.
  - id: cmip6_damip
    title: CMIP6 DAMIP and historical — near-surface air temperature, detection and attribution
    realm: aerial
    landing_page: https://pcmdi.llnl.gov/CMIP6/
    download_uri: https://storage.googleapis.com/cmip6/pangeo-cmip6.csv
    # Read from the Pangeo mirror on Google Cloud rather than ESGF, which needs an account and
    # client certificates. The mirror publishes the same data under the same terms.
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Eyring, V., Bony, S., Meehl, G. A., Senior, C. A., Stevens, B., Stouffer, R. J., Taylor, K. E.
      (2016). Overview of the Coupled Model Intercomparison Project Phase 6 (CMIP6) experimental
      design and organization. Geoscientific Model Development 9, 1937–1958.
      https://doi.org/10.5194/gmd-9-1937-2016 — with Gillett, N. P. et al. (2016), Detection and
      Attribution Model Intercomparison Project (DAMIP v1.0), Geoscientific Model Development 9,
      3685–3697, https://doi.org/10.5194/gmd-9-3685-2016, and the individual modelling centres
      credited per model as CMIP6 terms require.
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        Most CMIP6 output is CC BY 4.0, but the licence is set per modelling centre and a few are
        non-commercial. Any published product built on a specific model must carry that model's own
        terms, which is why the citation names the centres rather than only the project.
    # Simulated air temperature. There is no animal in it, and no place either -- one of these
    # climates did not happen.
    default_sensitivity: not_sensitive
    caveats: >-
      `hist-nat` is a counterfactual: it is what the models say the climate would have done under
      solar and volcanic forcing alone, and it must never be presented as an observation. Models are
      1–2° so a station-point sample is regional rather than local. `historical` ends in 2014, so the
      window both experiments share stops there while the observed record runs to 2025 — the
      attribution therefore uses a *ratio* from the models and a magnitude from observations, which
      is what makes the mismatch tolerable. A run starting in 1995 also begins in the recovery from
      Pinatubo, which can give `hist-nat` a positive trend from volcanic rebound alone and understate
      the human share, so the window is varied and both answers reported. Member counts are wildly
      uneven (fifty for MIROC6 and CanESM5, three for nine others), so members are averaged within a
      model before models are averaged together.
    added: 2026-07-30

  # The second counterfactual, and the reason there is a second: DAMIP asks what if there had been no
  # human forcing, ATTRICI asks what if there had been no warming. Same source for both halves,
  # because the factual half is the control that licenses using the other.
  - id: isimip3a
    title: ISIMIP3a GSWP3-W5E5 — factual and ATTRICI counterfactual near-surface air temperature
    realm: aerial
    landing_page: https://data.isimip.org/search/climate_scenario/counterclim/
    download_uri: https://files.isimip.org/api/v2
    # A files API that subsets server-side before sending, which is what makes a point panel
    # affordable here where ARCO-ERA5 made it impossible (ADR 0006). No account needed.
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Mengel, M., Treu, S., Lange, S., Frieler, K. (2021). ATTRICI v1.1 — counterfactual climate for
      impact attribution. Geoscientific Model Development 14, 5269–5284.
      https://doi.org/10.5194/gmd-14-5269-2021 — with Frieler, K. et al. (2024), Scenario set-up and
      forcing data for impact model evaluation and impact attribution within the third round of the
      Inter-Sectoral Impact Model Intercomparison Project (ISIMIP3a), Geoscientific Model Development
      17, 1–51, https://doi.org/10.5194/gmd-17-1-2024, and the GSWP3-W5E5 forcing it detrends.
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        CC BY 4.0 for the ISIMIP3a input data. A published product must credit ATTRICI and the
        GSWP3-W5E5 forcing separately, because the counterfactual is a transformation of somebody
        else's observational product rather than a dataset in its own right.
    # Two climates, one of which did not happen. There is no animal in either and, for the
    # counterfactual, no place either.
    evidence_type: null
    taxon_scope: null
    default_sensitivity: not_sensitive
    caveats: >-
      Half a degree, so a station-point sample is a cell mean over roughly 50 km — coarser than
      NARR's 32 km, finer than CMIP6's 1–2°, and regional rather than local. The binding limit is
      that `counterclim` ends in 2019 while the radar record runs to 2025, so any claim built here
      covers 25 of its 31 years and must say which; the same shape of mismatch as DAMIP's
      `historical` stopping in 2014, and reported the same way. `obsclim` is filed as GRIDDED and
      `counterclim` as SIMULATED, under two variable names rather than one with a scenario flag, so
      that "which climate is this" is a join condition instead of a string match. A one-station
      scoping probe found ATTRICI removing about 15% of the local June–July warming where DAMIP's
      ratio is 0.98 — not a contradiction, because one is a ratio of ensemble-mean forced signals
      and the other operates on a single cell's actual daily series, but the two must be reported
      side by side rather than averaged.
    added: 2026-07-31

  # The first source that is neither northern nor marine, and the one that fills the terrestrial
  # realm. Realm is a judgement: an atlas card records which birds occupy a patch of land, where
  # the radar in Phase 1a records birds in flight, so the same species can appear under both.
  # The first driver south of the equator, and the first that is not weather. Landed for
  # docs/methods/phase1g-water.md, which registered before the download that this factor is
  # explanatory only: no future surface water exists, so a coefficient fitted on it can never enter
  # a forecast.
  - id: jrc_gsw
    title: JRC Global Surface Water — occurrence and occurrence change intensity, v1.4
    realm: terrestrial
    landing_page: https://global-surface-water.appspot.com/download
    download_uri: https://storage.googleapis.com/global-surface-water/downloads2021
    # No licence *name* is given anywhere on the product. The download page states the Copernicus
    # terms verbatim -- "free of charge, without restriction of use" -- and requires the attribution
    # string and the citation below. Recorded as what it says rather than mapped onto a CC name it
    # does not claim.
    licence: Copernicus — free of charge, without restriction of use
    licence_url: https://www.copernicus.eu/en/access-data/copyright-and-licences
    citation: >-
      Pekel, J.-F., Cottam, A., Gorelick, N., Belward, A. S. (2016). High-resolution mapping of
      global surface water and its long-term changes. Nature 540, 418–422.
      https://doi.org/10.1038/nature20584. Data: EC JRC/Google, Global Surface Water Explorer v1.4,
      tiles change_* and occurrence_* v1_4_2021, accessed 2026-08-05. Source: EC JRC/Google.
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        The terms place no restriction on redistribution or commercial use beyond acknowledgement,
        which must credit "Source: EC JRC/Google" and cite Pekel et al. 2016. A derived product may
        therefore be drawn as well as analysed.
    # Water, seen from orbit. There is no animal in it, and the aggregate published from it is a
    # per-cell area with no taxon attached.
    default_sensitivity: not_sensitive
    caveats: >-
      The occurrence change intensity layer compares 1984–1999 with 2000–2021, read from the
      INSPIRE metadata shipped beside the tiles — not from the FAQ, which still describes the 2016
      release as 2000–2015, nor from the download page, which gives the collection span as
      1984–2024. Those epochs are the product's, not any study's: SABAP1 (1987–1991) sits inside the
      first and SABAP2 (2008–2012) inside a second that is twenty-two years long, so any comparison
      against an atlas window is nested rather than aligned and is attenuated toward zero. Per-year
      water classifications, which would allow an aligned comparison, are downloadable for 2015–2021
      only; earlier years exist solely as an Earth Engine collection needing an account. Values
      0–200 encode percentage-point change with 100 as no change; 253 is "not water", 254 "unable to
      compute" and 255 "no data", and all three must be excluded before any average. Landsat cannot
      see water under dense canopy or in cloud-persistent regions, and a small farm dam below the
      30 m pixel is invisible.
    added: 2026-08-05

  - id: sabap1
    title: Southern African Bird Atlas Project (SABAP1) — atlas cards, 1987–1991
    realm: terrestrial
    evidence_type: survey_index
    taxon_scope: exact
    landing_page: https://www.gbif.org/dataset/282d0ccb-4fa0-40f9-8593-105c77e88417
    download_uri: https://orphans.gbif.org/ZA/282d0ccb-4fa0-40f9-8593-105c77e88417.zip
    # Served by GBIF itself rather than by the publisher: the original IPT is gone, which is what
    # `orphans.gbif.org` means. SABAP2's IPT is still advertised and does not answer at all.
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      South African National Biodiversity Institute. Southern African Bird Atlas Project. Version
      1.0. Occurrence dataset https://doi.org/10.15468/ry4ux6 accessed via GBIF.org on 2026-07-30.
      Underlying atlas: Harrison, J. A., Allan, D. G., Underhill, L. G., Herremans, M., Tree, A. J.,
      Parker, V., Brown, C. J. (eds) (1997). The Atlas of Southern African Birds. BirdLife South
      Africa, Johannesburg.
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
    # Aggregate by construction, and generalised further than the TDWG Sensitive Species Extension
    # asks: a row is a count of atlas cards over a quarter-degree cell (~25 km) for one month,
    # pooled over every observer. There is no individual, no nest and no coordinate finer than the
    # cell in the source itself, so nothing here can be sharpened into a location. `low` rather than
    # `not_sensitive` because the taxa include species that are poaching-sensitive at fine scale,
    # and the gate should not record a judgement that the *species* are safe.
    default_sensitivity: low
    caveats: >-
      Citizen science, so effort is not fixed by design the way a trawl survey's is: cards per cell
      over the 1987–1991 core run from 4 at the tenth percentile to 119 at the ninetieth and 2,271 at
      the maximum, which is why reporting rate is stored as cards-with-species over cards and why the
      consistent-footprint rule from Phase 1b has to be applied before any comparison. Presence only
      — `occurrenceStatus` is empty for all 5,053,399 rows — so an absence is the absence of a row
      and the denominator has to come from the cards. Dates are month resolution: the `day` column
      holds 1, 28, 30 or 31, the ends of a month rather than an observation date. Years in the
      archive run from 1901 to 2975, both impossible, so the ingest keeps 1950–1999 and logs what it
      drops. 830 of 98,878 cards carry records in two cells and are counted once per cell, because a
      card that touches two cells contributed effort to both. The cell id is derived from the cell
      centre rather than reusing the atlas's quarter-degree letter codes, so it stays checkable
      against the coordinates in the same row.
    added: 2026-07-30

  # A second instrument on the system Phase 1a measured: same continent, longer record, a completely
  # different method. The strongest "effort fixed by design" source in the lake -- same route, same
  # 50 stops, same three minutes, since 1966 -- and the only one released into the public domain.
  - id: bbs
    title: North American Breeding Bird Survey — route counts, 1966–2025
    realm: terrestrial
    evidence_type: survey_index
    taxon_scope: exact
    landing_page: https://www.usgs.gov/centers/eesc/science/north-american-breeding-bird-survey
    download_uri: https://www.sciencebase.gov/catalog/item/6a0b0b0ab66b0188da36aedd
    licence: CC0 1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    citation: >-
      Ziolkowski, D. J., Lutmerding, M., Aponte, V. I., Hudson, M-A. R. (2026). North American
      Breeding Bird Survey Dataset 1966 - 2025: U.S. Geological Survey data release,
      https://doi.org/10.5066/P144YU3S. The survey depends on thousands of skilled volunteer
      observers, whose contribution the citation for the release represents.
    redistribution:
      allowed: true
      attribution_required: false
      commercial_use: true
      notes: >-
        Marked with CC0 1.0, a public-domain dedication, so attribution is not legally required.
        It is given anyway: the data exists because volunteers drove routes at dawn every June for
        sixty years, and a licence that does not compel credit is not a reason to withhold it.
    # Counts of birds seen and heard at fixed roadside stops, aggregated to a route of 50 stops and
    # published per route-run. No individual, no nest, and a route position that has been public
    # since 1966. `low` rather than `not_sensitive` because the taxa include species that are
    # sensitive at fine scale, and the gate should not record a judgement that they are not.
    default_sensitivity: low
    caveats: >-
      Roadside by design, so the sample is not a random sample of the landscape and the bias is not
      random with respect to land use — which matters directly for any comparison against a
      land-cover or urbanisation driver. Observer skill is the best-documented bias in the dataset:
      counts differ between observers and a first-year observer differs from a practised one, so
      `ObsN`, `RunType` and `RPID` all travel into the protocol field for use as break terms.
      Only RPID 101 is the standard protocol; other values are experimental or incidental runs that
      the survey's own analyses exclude. **2020 is absent entirely** — field activities were
      cancelled for COVID-19 — so a trend fit must be told about the gap rather than interpolating
      across it. Routes are added and abandoned over time and the loss is not random, which is the
      same missing-not-at-random problem the consistent-footprint rule addresses in Phase 1b. The
      publisher holds migrant and non-breeder records in a separate file, excluded from the counts
      landed here; the ingest reports how many, because it is a judgement made on our behalf.
      Species totals include unidentified groupings and hybrids whose AOU codes carry no binomial;
      those rows are dropped and counted, as they cannot be evidence about a taxon.
    added: 2026-07-30

  # The first European time series in the lake, and the first source anywhere in it with a fifty-year
  # run. Two datasets from one scheme, registered separately because they are two protocols with two
  # DOIs and two spans -- the same rule that made seven Movebank studies seven sources.
  - id: sbs_point_counts
    title: Swedish Bird Survey — summer point count routes (Sommarpunktrutterna), 1975–2024
    realm: terrestrial
    evidence_type: survey_index
    taxon_scope: exact
    landing_page: https://www.fageltaxering.lu.se/
    doi: 10.15468/2aajk9
    download_uri: https://www.gbif.se/ipt/archive.do?r=lu_sft_spkt
    licence: CC0 1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    citation: >-
      Lindström Å, Green M, Jönsson A (2025). Swedish Bird Survey: Summer point count routes
      (Sommarpunktrutterna). Version 1.8. Department of Biology, Lund University. Sampling event
      dataset https://doi.org/10.15468/2aajk9. The scheme runs on volunteer surveyors who have
      walked the same routes each spring since 1975.
    redistribution:
      allowed: true
      attribution_required: false
      commercial_use: true
      notes: >-
        CC0 1.0 on GBIF, so attribution is not legally required and is given anyway. The archive's
        own records carry `accessRights: Limited`, which refers to the species the publisher has
        withheld rather than to the rows released — see the caveats.
    default_sensitivity: low
    caveats: >-
      **Eleven species are absent by policy, not by absence, and a detection model must be told.**
      The publisher withholds every taxon at Swedish security class 4 or higher: black stork, lesser
      white-fronted goose, golden eagle, spotted eagle, white-tailed eagle, pallid harrier,
      Montagu's harrier, peregrine falcon, gyrfalcon, eagle owl and white-backed woodpecker. An
      occupancy model derives absence from "surveyed and not recorded", so for these eleven it would
      derive a false absence at every event in the scheme. They are excluded by name at the ingest
      and the count is reported.
      Coordinates are the centre of the 25 x 25 km grid square the route sits in, not the route:
      `coordinateUncertaintyInMeters` is 17,700 throughout, so nothing finer than that square is
      supported and a cell smaller than it would be inventing precision.
      Counts are the route total summed over twenty points, so a count is per route-visit rather
      than per point, and effort is the survey window from `eventTime` rather than a point count.
      Observer identity travels into `protocol`, as it does for BBS and for the same reason:
      observer skill is the best-documented bias in schemes of this kind and a trend fit needs it
      available as a break term.
    added: 2026-08-05

  - id: sbs_fixed_routes
    title: Swedish Bird Survey — fixed routes (Standardrutterna), 1996–2025
    realm: terrestrial
    evidence_type: survey_index
    taxon_scope: exact
    landing_page: https://www.fageltaxering.lu.se/
    doi: 10.15468/hd6w0r
    download_uri: https://www.gbif.se/ipt/archive.do?r=lu_sft_std
    licence: CC0 1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    citation: >-
      Lindström Å, Green M (2026). Swedish Bird Survey: Fixed routes (Standardrutterna). Version
      1.16. Department of Biology, Lund University. Sampling event dataset
      https://doi.org/10.15468/hd6w0r.
    redistribution:
      allowed: true
      attribution_required: false
      commercial_use: true
      notes: >-
        CC0 1.0 on GBIF, attribution given regardless. `accessRights: Limited` in the archive refers
        to the withheld species listed in the caveats.
    default_sensitivity: low
    caveats: >-
      **Sixteen taxa are absent by policy, not by absence.** The eleven birds the point-count scheme
      withholds, plus lynx, grey wolf, brown bear, wolverine and Arctic fox — this scheme records
      mammals too. Excluded by name at the ingest and counted, for the same reason: a derived
      absence would otherwise be manufactured for every one of them at every event.
      Unlike BBS this is a *systematic* design — one route in each 25 x 25 km square on a national
      grid, walked in the same direction at the same time of year — so it does not carry the
      roadside bias that BBS's own caveat records, which is the single best reason to hold both.
      Coordinates are the square's centre, uncertainty 17,700 m. Counts are the route total over
      eight 1 km line segments, and effort is the survey window from `eventTime`.
      Observer identity travels into `protocol`.
    added: 2026-08-05

  # The late half of an atlas-against-atlas comparison, twenty years after sabap1. Landed with the
  # same effort unit as that source on purpose: two similar-but-different denominators would make
  # the comparison meaningless, which is the whole reason this source is here.
  - id: sabap2
    title: Southern African Bird Atlas Project 2 (SABAP2) — atlas cards, 2007–2026
    realm: terrestrial
    evidence_type: survey_index
    taxon_scope: exact
    landing_page: https://www.gbif.org/dataset/906e6978-e292-4a8b-9c39-adf6bb0f3323
    download_uri: https://doi.org/10.15468/dl.wb5t54
    # A GBIF download DOI, not the dataset page: it pins the exact 25,687,526 records a result was
    # computed on, where "SABAP2" alone means whatever the atlas held on the day you asked. The
    # publisher's own IPT at aduipt.uct.ac.za:8080 does not answer at all — see
    # docs/methods/geographic-coverage.md.
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Brooks, M., Ryan, P. (2026). Southern African Bird Atlas Project 2. Version 1.87. FitzPatrick
      Institute of African Ornithology. Occurrence dataset, accessed via GBIF.org, download
      https://doi.org/10.15468/dl.wb5t54. Protocol described in Brooks, M., Rose, S., Altwegg, R.,
      Lee, A. T. K., Nel, H., Ottosson, U., Retief, E., Reynolds, C., Ryan, P. G., Shema, S., Tende,
      T., Underhill, L. G., Thomson, R. L. (2022). The African Bird Atlas Project: a description of
      the project and BirdMap data-collection protocol. Ostrich 93, 223–232.
      The atlas exists because thousands of volunteers submitted cards.
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
    # Aggregate by construction and generalised further than the TDWG extension asks: a row counts
    # atlas cards over a five-arcminute pentad for one month, pooled over observers. GBIF flags the
    # dataset as gridded, so the coordinates are pentad centroids rather than observation points.
    # `low` rather than `not_sensitive` for the same reason as sabap1 — the taxa include species
    # that are sensitive at fine scale, and the gate should not record a judgement that they are not.
    default_sensitivity: low
    caveats: >-
      Citizen science, so effort is not fixed by design the way a trawl survey's is: cards per pentad
      under the full protocol run from 1 at the tenth percentile to 32 at the ninetieth and 3,963 at
      the maximum, so the consistent-footprint rule from Phase 1b has to be applied before any
      comparison. Two protocols are landed **separately, never pooled** — a full-protocol card
      averages 52 species and an ad-hoc list 9.5, so one denominator cannot serve both; the protocol
      travels in the `protocol` field and 4,408,227 of 25,687,526 rows are ad-hoc. Presence only, so
      an absence is the absence of a row and the denominator comes from the cards. 390,194 rows carry
      no accepted species key, being unidentified or coarser than species, and are dropped and
      counted. Years in the archive run from 1930, early for a project that began in 2007 but not
      impossible for a retrospective card, so the ingest keeps 1900–2027 and the analysis window
      (2007–2025) excludes both the stragglers and the partial 2026. For 117,960 full-protocol rows
      the pentad embedded in the card identifier disagrees with the record's own `verbatimLocality`;
      the locality is taken as the authority and the disagreement reported rather than reconciled.
      Coverage is overwhelmingly South Africa. Comparing against SABAP1 means rolling nine pentads
      into each quarter-degree cell, and the two atlases differ in card duration as well as in grid.
    added: 2026-07-30

  # --- Terrestrial mammal tracks ------------------------------------------------
  #
  # Seven Movebank studies, registered as seven sources rather than one. `licence` is a single
  # field and these span CC0, CC BY and CC BY-NC: one entry would have to state the most
  # restrictive terms for all of them, and PROVENANCE.md is generated from here, so that would
  # publish a wrong licence for five studies.
  #
  # These are the first `track` sources, so they are the first to meet the rule that
  # individual-granularity evidence needs per-taxon sensitivity. Two of them publish nothing.
  # Pre-registered in docs/methods/phase1d-tracks.md; the source assessment is in
  # docs/methods/tracks-and-sensitivity.md.
  #
  # Every entry below was resolved from the Movebank study id, never from the study name.
  # Matching "Ya Ha Tinda elk" returns a CUSTOM-licensed duplicate first, and matching
  # `Canis lupus` returns stray dogs alongside wolves.

  - id: movebank_yahatinda_elk
    title: Ya Ha Tinda elk project, Banff National Park, 2001-2024 (females)
    evidence_type: track
    realm: terrestrial
    taxon_scope: exact
    landing_page: https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study897981076
    doi: 10.5441/001/1.5g4h5t6c
    licence: CC0 1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    citation: >-
      Hebblewhite M, Merrill EH, Martin H, Berg JE, Bohm H, Eggeman SL. 2020. Data from:
      Study "Ya Ha Tinda elk project, Banff National Park, 2001-2020 (females)". Movebank
      Data Repository. https://doi.org/10.5441/001/1.5g4h5t6c
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        CC0 waives rights; the citation is an academic obligation regardless. The Movebank
        study covers 2001-2024 while the deposited repository DOI covers 2001-2020, so the
        later years are cited to the study rather than to the DOI.
    default_sensitivity: moderate
    taxon_sensitivity:
      - taxon_key: 2440958
        sensitivity: moderate
        rationale: >-
          Cervus elaphus is abundant and managed, so not vulnerable in the endangerment
          sense. But this herd is partially migratory and leaves Banff for hunted ground,
          which is the subject of the study - the disclosure and the harm concern the same
          boundary.
    credential: movebank_user
    caveats: >-
      Female elk only, so nothing here describes male movement or the sexes together.
      Locations are GPS, one sensor type, which is why this study carries no protocol break.
      The Movebank event API needs both MIGRATLAS_CRED_MOVEBANK_USER and
      MIGRATLAS_CRED_MOVEBANK_PASSWORD, and serves data only after a licence handshake.
    added: 2026-08-01

  - id: movebank_mountain_caribou_bc
    title: Mountain caribou in British Columbia (South Peace Northern Caribou)
    evidence_type: track
    realm: terrestrial
    taxon_scope: exact
    landing_page: https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study216040785
    doi: 10.5441/001/1.p5bn656k
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: >-
      Seip DR, Price E. 2019. Data from: Science update for the South Peace Northern Caribou
      (Rangifer tarandus caribou pop. 15) in British Columbia. Movebank Data Repository.
      https://doi.org/10.5441/001/1.p5bn656k
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        CC BY permits redistribution with attribution, and this field records that and only
        that. The ethics gate refuses this source anyway on `high` sensitivity - but the two
        are independent reasons and must stay independent, because PROVENANCE.md is generated
        from here and `allowed: false` would publish a false claim about someone else's
        licence. A trend computed from the data may still be reported: see
        phase1d-tracks.md section 2.
    default_sensitivity: high
    taxon_sensitivity:
      - taxon_key: 5220114
        sensitivity: high
        rationale: >-
          Southern mountain caribou are among the most endangered large mammals in North
          America, in herds of tens of animals, and several herds went extinct inside this
          study's 1988-2016 window. A small herd's locations are a small herd's whereabouts.
          Classified per source rather than per species: Svalbard's reindeer are the same
          species and are not in this position.
    credential: movebank_user
    caveats: >-
      Mixes GPS with older radio transmitters, and fix rates differ between them by an order
      of magnitude - a fix-rate change is indistinguishable from a behaviour change unless it
      is modelled, so a break term per sensor type is mandatory. Ends in 2016. This is one
      population, not the species.
    added: 2026-08-01

  - id: movebank_missouri_bison
    title: Missouri Bison Tracking Project
    evidence_type: track
    realm: terrestrial
    taxon_scope: exact
    landing_page: https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study8019591
    licence: CC BY 4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    # The study supplies no citation of its own. Constructed from the study record rather than
    # left blank, because the model refuses a blank one and inventing an author would be worse.
    citation: >-
      Missouri Bison Tracking Project. Movebank study 8019591.
      https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study8019591
      (No citation supplied by the study; cite the study record.)
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: >-
        CC BY permits redistribution with attribution. Attribution is awkward here because
        the study names no author; the study record is the only citable object.
    default_sensitivity: low
    taxon_sensitivity:
      - taxon_key: 2441176
        sensitivity: low
        rationale: >-
          A conservation herd on managed, fenced ground. No market, no persecution pressure,
          and no disturbance route that a coarse gridded surface would open.
    credential: movebank_user
    caveats: >-
      A fenced conservation herd, so its movement is bounded by a fence rather than by
      habitat or weather - it cannot speak to migration, and any timing metric computed from
      it describes movement inside an enclosure. Carries an Acceleration sensor alongside GPS.
      KNOWN BAD DATA, not filtered: 617 of its rows sit at 52.43N 13.52E, which is Berlin -
      five collars bench-tested at the manufacturer between 2022-08-26 and 2022-08-31 before
      being shipped and fitted, recorded under the same animal ids as those animals' real
      Missouri tracks and marked deployed and visible. They put Berlin on this source's cells.
      Removing them needs a per-taxon speed filter; two simpler filters were tried and each
      deleted real data instead. See the comment at the top of ingest/movebank.py.
    added: 2026-08-01

  - id: movebank_bylot_fox_gps
    title: Arctic fox Bylot - GPS-UHF tracking
    evidence_type: track
    realm: terrestrial
    taxon_scope: exact
    landing_page: https://www.movebank.org/cms/webapp?gwt_fragment=page=studies,path=study1241071371
    licence: CC0 1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    citation: >-
      Clermont J, Grenier-Potvin A, Duchesne E, Couchoux C, Dulude-de Broin F, Beardsell A,
      Bety J, Berteaux D. 2021. The predator activity landscape predicts the anti-predator
      behavior and distribution of prey in a tundra community. Ecosphere 12(12):e03858.
      https://doi.org/10.1002/ecs2.3858
    redistribution:
      allowed: true
      attribution_required: true
      commercial_use: true
      notes: CC0 waives rights; the citation is an academic obligation regardless.
    default_sensitivity: low
    taxon_sensitivity:
      - taxon_key: 5219303
        sensitivity: low
        rationale: >-
          Vulpes lagopus is trapped for fur across much of its range, so the harmful activity
          exists. Bylot Island is a national park with no resident trapping, and the
          population is neither localised nor targeted, so disclosure at a 0.25-degree grid
          thirty days stale opens no route to it.
    credential: movebank_user
