name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Interpreter comes from .python-version so CI cannot drift from local.
      - run: uv sync --all-extras --group dev --frozen

      - name: Lint
        run: |
          uv run -- ruff check src tests
          uv run -- ruff format --check src tests

      - name: Typecheck
        run: uv run -- mypy

      - name: Test
        run: uv run -- pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # build runs check-build, which asserts no bundle names an asset that was never
      # emitted. Both typecheck and build passed while the globe rendered nothing at all.
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      # The only check that asks the map what it actually drew. Everything above passed during
      # the release that rendered an empty canvas.
      - run: npm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
