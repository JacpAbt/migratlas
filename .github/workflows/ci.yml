name: CI

# `develop` is here because it was not, and that was a hole. With only `main` and `pull_request`,
# a long stretch of work on `develop` between pull requests ran no CI at all -- 37 commits landed
# unverified once, and the branch was only checked when a PR happened to be open against it.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job carries a deadline, because on 2026-08-19 two runs in a row -- the `develop` push and
# the `main` merge behind it -- were cancelled at GitHub's own six-hour job limit. Neither failed:
# `playwright install --with-deps` stalled inside `apt-get update` against the Azure Ubuntu mirror
# and never returned, while runs on either side of them finished in 21 and 42 minutes. With no
# deadline a stalled mirror is indistinguishable from a slow suite for six hours, twice, and the
# merge it was gating waited on both. The numbers below are the observed durations with room, not
# guesses: a gate that cannot report is a gate that lies.
jobs:
  python:
    runs-on: ubuntu-latest
    # Runs in about a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Interpreter comes from .python-version so CI cannot drift from local.
      - run: uv sync --all-extras --group dev --frozen

      - name: Lint
        run: |
          uv run -- ruff check src tests
          uv run -- ruff format --check src tests

      - name: Typecheck
        run: uv run -- mypy

      - name: Test
        run: uv run -- pytest

  web:
    runs-on: ubuntu-latest
    # The Playwright suite is the long pole and takes 21 to 42 minutes here at two workers.
    timeout-minutes: 75
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # build runs check-build, which asserts no bundle names an asset that was never
      # emitted. Both typecheck and build passed while the globe rendered nothing at all.
      - run: npm run build

      # `--with-deps` is an `apt-get` behind a browser download, which is the step that hung. Its own
      # deadline so the failure names the cause instead of arriving as "the job ran out of time".
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 12
      # The only check that asks the map what it actually drew. Everything above passed during
      # the release that rendered an empty canvas.
      - run: npm test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
