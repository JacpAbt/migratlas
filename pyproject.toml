[project]
name = "migratlas"
version = "0.1.0"
description = "A globe of animal movement, and why it's changing."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

# Kept deliberately lean. Each phase adds its own optional group rather than
# growing this list, so a fresh clone can run the Phase 0 gate tests without
# pulling a geospatial or CUDA stack.
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "numpy>=2.0",
    "polars>=1.9",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Raster/vector IO and cloud-native formats. Wheel-only on purpose: nothing here
# may need a system package or a build-from-source step.
geo = [
    # Climate models mostly do not use a real calendar -- 365_day, 360_day and proleptic_gregorian
    # all appear across CMIP6 -- and without cftime xarray refuses to decode the time axis rather
    # than guessing. Skipping those stores silently drops nine of fifteen models from the DAMIP
    # ensemble along a line drawn by which centre picked which calendar.
    "cftime>=1.6",
    "fsspec>=2024.9",
    # Reading the Pangeo CMIP6 zarr mirror on Google Cloud, anonymously.
    "gcsfs>=2024.9",
    # Reads the NetCDF4/HDF5 files CDS serves. h5netcdf over netCDF4 because it needs only the
    # h5py wheel and no system HDF5 or libnetcdf, which is the no-sudo constraint in ADR 0003.
    # h5py is named explicitly: h5netcdf declares it optional, so resolving it alone leaves a
    # backend that imports and then refuses to open anything.
    "h5netcdf>=1.4",
    "h5py>=3.12",
    # OPeNDAP, which is how point drivers are sampled -- see adr/0006. Pure Python, so it
    # needs no system netCDF or HDF5 library, unlike netCDF4's DAP support.
    "pydap>=3.5",
    "pyogrio>=0.10",
    # Unprojecting the Sea Ice Index's polar stereographic shapefiles (EPSG:3411/3412).
    # Hand-rolling a map projection is this project's signature silent-wrong-answer.
    "pyproj>=3.6",
    "rioxarray>=0.17",
    "shapely>=2.0",
    "xarray>=2024.9",
    "zarr>=2.18",
]
tiles = ["pmtiles>=3.4"]
# Reading R's serialisation format. FISHGLOB publishes .RData and nothing else.
rdata = ["pyreadr>=0.5", "rdata>=0.11"]
stats = ["scipy>=1.14", "statsmodels>=0.14"]

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
migratlas = "migratlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migratlas"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # unused arguments
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "DTZ",  # flake8-datetimez -- naive datetimes are a real bug source here
    "E",
    "EM",   # exception messages
    "ERA",  # commented-out code
    "F",
    "FBT",  # boolean trap
    "I",    # isort
    "ICN",
    "N",
    "PD",   # pandas-vet
    "PGH",  # no blanket type: ignore
    "PIE",
    "PL",   # pylint
    "PT",   # pytest style
    "PTH",  # use pathlib
    "RET",
    "RUF",
    "S",    # bandit
    "SIM",
    "SLF",
    "T20",  # no print outside cli
    "TCH",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "ANN401",  # Any is occasionally right at IO boundaries
    "TRY003",  # long messages inside raise read fine with EM enforced
]

[tool.ruff.lint.per-file-ignores]
# TC001-003 want typing-only imports moved into a TYPE_CHECKING block, which exists to
# cut import cost and avoid runtime dependencies. Neither matters in a test module, and
# the block is pure ceremony around `tmp_path: Path`.
# RUF001 flags visually ambiguous unicode -- but a test for apostrophe and accent folding
# has to contain the real characters, or it is testing nothing.
"tests/**" = ["S101", "PLR2004", "ANN201", "SLF001", "TC001", "TC002", "TC003", "RUF001"]
"src/migratlas/cli.py" = ["T20"]  # the CLI is where printing belongs

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Pydantic resolves annotations at runtime to build validators, so moving a type used in
# a model field into a TYPE_CHECKING block breaks validation at import. Telling ruff
# which bases are runtime-evaluated is the fix; per-line noqa would just hide it.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

# Libraries that ship no py.typed marker. Listed explicitly rather than via a
# global ignore_missing_imports, so that a genuinely mistyped import still fails.
[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "pmtiles.*",
    "pyarrow.*",
    "pyogrio.*",
    "pyreadr.*",
    "rdata.*",
    "rasterio.*",
    "scipy.*",
    "shapely.*",
    "statsmodels.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "network: hits a real remote source; skipped unless --run-network is passed",
    "localdata: needs operator-placed raw files; skipped unless --run-localdata is passed",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/migratlas"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
