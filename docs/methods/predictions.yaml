# Not prediction-bearing, or grading in prose that predates the numbered convention. Listed so the
# drift guard can tell "excluded on purpose" from "forgotten".
excluded:
  - note: phase1-phenology.md
    why: >-
      Phase 1a is a replication of a published result and predates the numbered convention. It carries
      falsification tests and a permutation null rather than numbered predictions.
  - note: phase1b-marine.md
    why: >-
      Four falsification checks fixed in advance and graded in prose rather than numbered and graded
      individually. Counting them would mean deciding what each verdict was, which is authorship.
  - note: phase1c-homogeneity.md
    why: Tests A to D with predictions graded in prose, on the same reasoning as phase1b.
  - note: counterfactual.md
    why: A drawing decision, not a phase. It estimates nothing.
  - note: detectability.md
    why: Built after the fact and states so; every threshold in it is one an earlier phase published.
  - note: geographic-coverage.md
    why: An audit and a plan. Its corrections are to its own earlier claims, not graded predictions.
  - note: covariate-survey-2026-08.md
    why: A source survey. Verified catalogue facts, no estimand.
  - note: covariate-survey-2026-08-addendum.md
    why: As above.
