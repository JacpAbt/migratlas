# Every registered prediction this project has graded, counted per phase.
#
# Why this file exists. The convention `CLAUDE.md` calls the most valuable thing in the repository is
# pre-registration: numbered falsifiable predictions fixed before the data is fetched, then graded in
# the same note whichever way they went. The project has been doing that for two months and had never
# published how often it was wrong. A convention nobody scores is a habit.
#
# Why it is authored rather than parsed. The notes grade in prose and the prose is not uniform --
# `GRADED TRUE`, `— HOLDS`, `**failed**`, `PART PASS`, `UNGRADEABLE` all appear, and eight notes use
# wording an extractor misses entirely. A regex over that would enshrine the inconsistency and would
# silently undercount -- the first attempt found 65 graded predictions where a careful read of the
# same notes found half again as many. The total is computed from the entries below, not typed here.
# So this is hand-authored from the notes, the way `registry.yaml` is hand-authored, and
# `tests/test_predictions.py` is the drift guard -- every note must be listed here or excluded with a
# reason, so a new phase cannot go uncounted.
#
# Counting rules, fixed here so they are not chosen per phase:
#   * `true` and `false` are the note's own verdict on a numbered prediction. A "PART PASS" counts
#     true, because the note reports it as met on its registered terms.
#   * `ungradeable` is a prediction the phase registered and could not grade -- a fired stop condition
#     above it, a floor that intersected below its own count, a secondary deliberately not run.
#   * A two-sided prediction with no registered direction is `ungradeable`, not true: there was
#     nothing to be wrong about.
#   * `stop_conditions_fired` counts registered conditions that bound and changed what was published.
#
# The headline number is the failure rate over graded predictions. It is meant to be high: a
# convention that only ever confirms was not testing anything.

phases:
  - note: phase1d-tracks.md
    registered: 4
    true_: 4
    false_: 0
    ungradeable: 0
    stop_conditions_fired: 0

  - note: phase1e-atlas.md
