    false_: 2
    ungradeable: 0
    stop_conditions_fired: 1
    comment: >-
      Prediction 5 is a PART PASS and counts true. The fired condition is the one that mattered: the
      detection correction and the naive comparison agreed, so the interesting half was wrong.

